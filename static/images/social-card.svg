<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f0f0d"/>
  <rect x="36" y="36" width="1128" height="558" stroke="rgba(212,208,200,0.18)"/>
  <line x1="600" y1="36" x2="600" y2="594" stroke="rgba(212,208,200,0.14)"/>

  <!-- Left: eyebrow -->
  <g>
    <line x1="72" y1="92.5" x2="98" y2="92.5" stroke="#c8351a"/>
    <text x="112" y="97" fill="#c8351a" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="16" letter-spacing="3.2">THE PLAYBOOK FOR THE AI ERA</text>
  </g>

  <!-- Left: headline -->
  <text x="72" y="185" fill="#f5f3ee" font-family="'Playfair Display',Georgia,serif" font-size="64" font-weight="500">
    <tspan x="72" dy="0">Alpha is made</tspan>
    <tspan x="72" dy="76">or missed</tspan>
    <tspan x="72" dy="76">on phase.</tspan>
  </text>
  <text x="72" y="452" fill="rgba(245,243,238,0.55)" font-family="'Playfair Display',Georgia,serif" font-size="30" font-style="italic">Transform · Grow · Hold · Exit</text>

  <!-- Left: identity -->
  <text x="72" y="558" fill="#f5f3ee" font-family="'Playfair Display',Georgia,serif" font-size="24" font-weight="500">Andrew Hunter</text>
  <text x="72" y="581" fill="rgba(245,243,238,0.42)" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" letter-spacing="2.1">PHASE-AWARE AI · PRIVATE EQUITY</text>

  <!-- Right: the four bets -->
  <g>
    <text x="664" y="112" fill="rgba(245,243,238,0.38)" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="14" letter-spacing="2.8">CONSULTING.ANDREWPHUNTER.COM</text>

    <text x="664" y="176" fill="#c8351a" font-family="'Playfair Display',Georgia,serif" font-size="26" font-style="italic">T</text>
    <text x="704" y="176" fill="#f5f3ee" font-family="'Playfair Display',Georgia,serif" font-size="26" font-weight="500">Transform</text>
    <text x="704" y="206" fill="rgba(245,243,238,0.58)" font-family="'EB Garamond',Georgia,serif" font-size="18">The structural remake. The biggest AI bet.</text>
    <line x1="704" y1="230.5" x2="1098" y2="230.5" stroke="rgba(212,208,200,0.14)"/>

    <text x="664" y="274" fill="#c8351a" font-family="'Playfair Display',Georgia,serif" font-size="26" font-style="italic">G</text>
    <text x="704" y="274" fill="#f5f3ee" font-family="'Playfair Display',Georgia,serif" font-size="26" font-weight="500">Grow</text>
    <text x="704" y="304" fill="rgba(245,243,238,0.58)" font-family="'EB Garamond',Georgia,serif" font-size="18">AI as an EBITDA multiplier.</text>
    <line x1="704" y1="328.5" x2="1098" y2="328.5" stroke="rgba(212,208,200,0.14)"/>

    <text x="664" y="372" fill="#c8351a" font-family="'Playfair Display',Georgia,serif" font-size="26" font-style="italic">H</text>
    <text x="704" y="372" fill="#f5f3ee" font-family="'Playfair Display',Georgia,serif" font-size="26" font-weight="500">Hold</text>
    <text x="704" y="402" fill="rgba(245,243,238,0.58)" font-family="'EB Garamond',Georgia,serif" font-size="18">AI as efficiency and de-risking.</text>
    <line x1="704" y1="426.5" x2="1098" y2="426.5" stroke="rgba(212,208,200,0.14)"/>

    <text x="664" y="470" fill="#c8351a" font-family="'Playfair Display',Georgia,serif" font-size="26" font-style="italic">E</text>
    <text x="704" y="470" fill="#f5f3ee" font-family="'Playfair Display',Georgia,serif" font-size="26" font-weight="500">Exit</text>
    <text x="704" y="500" fill="rgba(245,243,238,0.58)" font-family="'EB Garamond',Georgia,serif" font-size="18">AI as a diligence narrative.</text>
  </g>
