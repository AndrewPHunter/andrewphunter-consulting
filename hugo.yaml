baseURL: "https://consulting.andrewphunter.com/"
languageCode: "en-us"
title: "TGHE — The Playbook for the AI Era"
theme: "consulting"

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
  highlight:
    noClasses: false

outputs:
  home: ["HTML"]
  section: ["HTML"]
  page: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

disableKinds: ["taxonomy", "term"]

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      keepQuotes: true

params:
  email: "me@andrewphunter.com"
  blogURL: "https://andrewphunter.com"
  description: "TGHE: Transform, Grow, Hold, Exit. Phase-aware AI and the operational-alpha playbook for private equity."
